# 推送版本标签（如 v1.0.0）时构建并发布镜像：
#   ghcr.io/<owner>/<镜像名>:{latest, v1.0.0}          CPU 版
#   ghcr.io/<owner>/<镜像名>:{cuda, v1.0.0-cuda}       CUDA 版（NVIDIA GPU）
# 镜像名默认 lingva-server（公开分发的镜像，install.sh 默认拉取它）；其他仓库在 Settings → Variables
# 里设置 IMAGE_NAME（如私有仓库设为 lingva-server-official），各自构建、推送自己的镜像，互不覆盖。
# 配置了以下仓库 Secrets 时，同时推送到国内镜像仓库（如阿里云 ACR），供国内服务器拉取：
#   ALIYUN_REGISTRY（如 registry.cn-shanghai.aliyuncs.com）、ALIYUN_NAMESPACE、ALIYUN_USERNAME、ALIYUN_PASSWORD
# 同地域的阿里云 ECS 用 install.sh 安装时，会自动改从 VPC 内网地址（registry-vpc.<地域>.aliyuncs.com）拉取
# 注意：GHCR 的包首次发布后默认是私有的，需要在 GitHub 的 Packages 设置里改为 Public，用户才能匿名拉取。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            onnxruntime_gpu: 0
          - variant: cuda
            torch_index: https://download.pytorch.org/whl/cu124
            # 气泡检测也走 CUDA（onnxruntime-gpu）
            onnxruntime_gpu: 1
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'lingva-server' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.ALIYUN_REGISTRY != ''
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Compute tags
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          images="ghcr.io/$owner/$IMAGE_NAME"
          if [ -n "$ALIYUN_REGISTRY" ]; then
            images="$images $ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$IMAGE_NAME"
          fi
          tags=""
          for img in $images; do
            if [ "${{ matrix.variant }}" = cpu ]; then
              tags="$tags,$img:latest"
              [[ "$GITHUB_REF" == refs/tags/* ]] && tags="$tags,$img:$GITHUB_REF_NAME"
            else
              tags="$tags,$img:cuda"
              [[ "$GITHUB_REF" == refs/tags/* ]] && tags="$tags,$img:$GITHUB_REF_NAME-cuda"
            fi
          done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            ONNXRUNTIME_GPU=${{ matrix.onnxruntime_gpu }}
          tags: ${{ steps.tags.outputs.tags }}
          # 不附带 provenance / SBOM 证明：它们以 OCI 空清单的形式推送，阿里云 ACR 个人版会拒绝
          # （denied: unknown manifest class for application/vnd.oci.empty.v1+json）
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
