# 一键部署见 deploy/install.sh；配置全部在 .env 里（install.sh 会生成，也可以照 .env.example 手写）。
#   启动 / 更新：docker compose up -d --build
#   查看日志：  docker compose logs -f lingva
#   停止：      docker compose down
# .env 里的 COMPOSE_PROFILES=https 会同时启动 Caddy（自动 HTTPS），COMPOSE_FILE 可叠加 GPU 配置。

services:
  lingva:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-}
        TORCH_VERSION: ${TORCH_VERSION:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-}
        ONNXRUNTIME_GPU: ${ONNXRUNTIME_GPU:-0}
    image: lingva-server:latest
    env_file: .env
    environment:
      MODEL_DIR: /models
    volumes:
      - ./models:/models
    ports:
      # 启用 Caddy 时只对本机开放（LINGVA_BIND=127.0.0.1），由 Caddy 对外提供 HTTPS
      - "${LINGVA_BIND:-0.0.0.0}:${LINGVA_PORT:-8000}:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on:
      - lingva
    environment:
      LINGVA_SITE: ${LINGVA_SITE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
